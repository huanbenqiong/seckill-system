# RocketMQ Broker 配置
# brokerIP1 必须设为宿主机可访问的 IP（127.0.0.1 通过端口映射 10911:10911 转发）
brokerIP1=127.0.0.1

# 连接 NameServer（Docker 内部网络，用容器名）
namesrvAddr=seckill-namesrv:9876

brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

# 自动创建 Topic（开发环境）
autoCreateTopicEnable=true
