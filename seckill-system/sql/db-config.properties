# =========================================
# 数据库配置文件
# 秒杀系统 - 数据库连接配置
# =========================================
#
# 使用说明：
# 1. 将此文件放到 sql 目录下
# 2. 团队成员根据本地环境修改以下配置
# 3. 运行 01_schema.sql 初始化数据库表结构
# 4. 运行 02_sample_data.sql 插入测试数据（可选）
#

# ==================== MySQL 连接配置 ====================

# 数据库连接地址
# 本地开发: localhost 或 127.0.0.1
# 远程服务器: 填写实际IP或域名
db.url=jdbc:mysql://127.0.0.1:3306/seckill_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true

# 数据库用户名
db.username=root

# 数据库密码
db.password=1234

# JDBC 驱动（MySQL 8.x 使用 com.mysql.cj.jdbc.Driver）
db.driver=com.mysql.cj.jdbc.Driver

# ==================== 连接池配置（Druid） ====================

# 初始化连接数
db.initialSize=5

# 最小空闲连接数
db.minIdle=5

# 最大连接数
db.maxActive=20

# 连接最大等待时间（毫秒）
db.maxWait=60000


# ==================== 各服务数据库名称 ====================

# 用户服务数据库
db.user.database=seckill_system

# 商品服务数据库（可拆分）
db.goods.database=seckill_system

# 订单服务数据库（可拆分）
db.order.database=seckill_system


# ==================== MySQL 数据库名（初始化时使用） ====================
# 在 sql/01_schema.sql 中已创建此数据库
MYSQL_DATABASE=seckill_system


# ==================== 注意事项 ====================
# 1. MySQL 8.x 推荐使用 mysql-connector-j 而不是旧的 mysql-connector-java
# 2. serverTimezone=Asia/Shanghai 确保时区正确
# 3. allowPublicKeyRetrieval=true 解决 SSH 连接时的公钥检索问题
# 4. useSSL=false 本地开发可关闭 SSL，生产环境建议开启
